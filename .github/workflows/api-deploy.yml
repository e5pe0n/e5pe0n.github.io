name: Deploy API

# Tests api/ and rolls a new image out to the stuck-trace-api Cloud Run
# service. The service and everything around it are defined in e5pe0n/infra;
# this only rolls out new images. Repository variables (set from that repo's
# outputs):
#   GCP_PROJECT_ID, GCP_REGION, GCP_WIF_PROVIDER, GCP_DEPLOY_SA

# Runs on main itself: Workload Identity Federation only accepts tokens for
# refs/heads/main.
on:
  push:
    branches: [main]
    paths:
      - api/**
      - .github/workflows/api-deploy.yml
  workflow_dispatch:

permissions:
  contents: read
  # To get a GitHub OIDC token, which Workload Identity Federation exchanges
  # for short-lived Google credentials: no stored keys.
  id-token: write

concurrency:
  group: api-deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile --filter @stuck-trace/api

      - name: Typecheck
        run: pnpm --filter @stuck-trace/api typecheck

      - name: Test
        run: pnpm --filter @stuck-trace/api test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    env:
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/stuck-trace/api:${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: api
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      # Only the image changes; the rest of the service's settings (env vars,
      # service account, scaling) come from e5pe0n/infra.
      - name: Deploy
        run: >
          gcloud run deploy stuck-trace-api
          --image "$IMAGE"
          --project ${{ vars.GCP_PROJECT_ID }}
          --region ${{ vars.GCP_REGION }}
          --quiet
